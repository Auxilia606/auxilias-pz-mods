name: Validate

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate every registered mod
        shell: pwsh
        run: ./tools/validate.ps1

      - name: Build and audit every package
        shell: pwsh
        run: ./tools/package.ps1 -OutputDirectory "$env:RUNNER_TEMP/package"

      - name: Upload audited package
        uses: actions/upload-artifact@v7
        with:
          name: project-zomboid-mods-${{ github.sha }}
          path: ${{ runner.temp }}/package/*
          if-no-files-found: error
          retention-days: 14
