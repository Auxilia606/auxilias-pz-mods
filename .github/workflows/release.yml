name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath ./VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version."
          }

      - name: Build and audit release package
        shell: pwsh
        run: ./tools/package.ps1 -OutputDirectory "$env:RUNNER_TEMP/release"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/release" -File |
            Select-Object -ExpandProperty FullName
          if ($assets.Count -ne 2) {
            throw "Expected a ZIP and SHA-256 file, found $($assets.Count) files."
          }
          gh release create $env:GITHUB_REF_NAME @assets `
            --repo $env:GITHUB_REPOSITORY `
            --title $env:GITHUB_REF_NAME `
            --generate-notes `
            --verify-tag
