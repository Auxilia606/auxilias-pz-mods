name: Release

on:
  push:
    tags:
      - "*/v*.*.*"
  workflow_dispatch:
    inputs:
      mod:
        description: Registered mod slug to release from its existing tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve and verify mod release tag
        shell: pwsh
        run: |
          $registry = Get-Content -LiteralPath ./config/mods.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -notmatch '^(?<slug>[a-z0-9-]+)/v(?<version>\d+\.\d+\.\d+)$') {
              throw "Release tag must look like <mod-slug>/v1.2.3: $env:GITHUB_REF_NAME"
            }
            $slug = $Matches.slug
            $tagVersion = $Matches.version
          }
          else {
            $slug = '${{ inputs.mod }}'
            $tagVersion = $null
          }

          $project = @($registry.mods | Where-Object slug -eq $slug)
          if ($project.Count -ne 1) {
            throw "Unknown or duplicate mod slug: $slug"
          }
          $version = (Get-Content -LiteralPath (Join-Path $project[0].path 'VERSION') -Raw).Trim()
          if ($null -ne $tagVersion -and $tagVersion -ne $version) {
            throw "Tag version $tagVersion does not match $slug VERSION $version."
          }
          $expectedTag = "$($project[0].releaseTagPrefix)$version"
          git rev-parse --verify "refs/tags/$expectedTag"
          if ($LASTEXITCODE -ne 0) { throw "Required tag $expectedTag does not exist." }
          git checkout --detach $expectedTag
          "MOD_SLUG=$slug" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=$expectedTag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and audit release package
        shell: pwsh
        run: ./tools/package.ps1 -Mod $env:MOD_SLUG -OutputDirectory "$env:RUNNER_TEMP/release"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $env:RELEASE_TAG already exists."
            exit 0
          }

          $assets = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/release" -File |
            Select-Object -ExpandProperty FullName
          if ($assets.Count -ne 2) {
            throw "Expected a ZIP and SHA-256 file, found $($assets.Count) files."
          }
          gh release create $env:RELEASE_TAG @assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "$env:MOD_SLUG $env:RELEASE_TAG" `
            --generate-notes `
            --verify-tag
